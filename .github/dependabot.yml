version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Blocked updates. Each entry is scoped to ONLY the known-bad line so the next
    # line still surfaces — e.g. next 16.4.x will open a PR even though 16.3.x is
    # ignored. Every entry MUST carry its blocker and lift condition.
    #
    # These are NOT permanent. See "Ignored Dependency Updates — Review Protocol" in
    # AGENTS.md — an ignore with no review is how a project silently falls years behind.
    #
    # IMPORTANT: a `versions:` ignore ALSO suppresses Dependabot security-update PRs
    # inside that range (undocumented by GitHub; `update-types:` does not behave this
    # way). Dependabot ALERTS are unaffected and are the signal that survives — they
    # must stay enabled.
    ignore:
      # BLOCKER: 0.11.0 took the live site down on 2026-09-04. Initialisation became
      #   blocking — setInitPromise()/ensureInitialized() in dist/handlers/base.js,
      #   awaited by get() (base.js:237) and set() (base.js:323) — and initialize()
      #   awaits initializeTagsMapping() first (base.js:79), which reads and rewrites
      #   cache/tags/tags.json.
      #   Live crash-looped every 1-4 minutes: requests queued behind the unresolved
      #   init, health probes failed, the container was killed and restarted. 0.9.0
      #   ran the same work fire-and-forget, so identical conditions merely served
      #   uncached — degraded, but up. Rolling live back restored service.
      #   NOT EXPLAINED: the log showed thousands of concurrent GCS requests and
      #   socket exhaustion. The init path issues only tens of requests (the route
      #   sweep enumerates route-cache/, which holds tens of objects on live, not the
      #   ~18k under fetch-cache/), so init is not the source. Three explanations were
      #   investigated and are wrong: an unreachable bucket, 0.11.0's image cache, and
      #   a large route-cache sweep. Do not repeat them.
      # LIFT WHEN: a release survives a deploy on an environment carrying a cache
      #   comparable to live's, across BOTH prefixes since which one matters is
      #   unresolved. A green CI run does NOT qualify: the handler is inert unless
      #   NODE_ENV=production and PANTHEON_ENVIRONMENT are both set
      #   (next.config.ts:9), so local build and E2E never instantiate it. Nor does a
      #   PR environment, which carries roughly a hundred objects.
      # SCOPE: ">0.9.0" rather than "0.11.x" on purpose. Unlike the `next` entry, where
      #   the next minor should still surface, every version above 0.9.0 here is
      #   untested against a warm cache, so a future 0.12.0 must not pass either.
      # SECURITY: a `versions:` ignore also suppresses security-update PRs in this
      #   range. Accepted: alerts still fire, and an outage on every deploy is the
      #   larger risk. Revisit if an advisory lands against 0.9.0.
      - dependency-name: "@pantheon-systems/nextjs-cache-handler"
        versions: [">0.9.0"]
      # BLOCKER: 16.3.x fails Pantheon's buildpack at "Finalizing page optimization"
      #   with ENOENT .next/next-server.js.nft.json, which output:'standalone'
      #   requires. Confirmed identically on 16.3.1 (build 6c1e9cf6), 16.3.3
      #   (1fe23cd4) and 16.3.4 (1fe6a733) — three releases, same error.
      #   Does not reproduce locally — only in Pantheon's Linux buildpack under
      #   Turbopack, so a green local build proves nothing.
      # LIFT WHEN: a PR environment builds green on a 16.3.x release. Given three
      #   identical failures, 16.4.x is the likelier candidate — but as of 2026-09-01
      #   only 16.4.0-canary.* exists, so there is nothing stable to test yet.
      # NOTE: 16.4.x is deliberately NOT ignored and will still open a PR.
      # SECURITY: `next` vendors its own postcss@8.4.31 and sharp@0.34.5, which carry
      #   three open HIGH Dependabot alerts. Dependabot's only remedy is bumping `next`
      #   into 16.3.x (it opened PR #94 proposing 16.3.4 for exactly this), so no PR
      #   will appear here for them. That does NOT make them unfixable: an npm
      #   `overrides` block collapses the vendored copies onto the patched top-level
      #   versions and is verified to pass the full local gate — it just is not yet
      #   validated on the Pantheon buildpack. See "Security status of the pin" in
      #   docs/configuration/DEPLOYMENT.md.
      - dependency-name: "next"
        versions: ["16.3.x"]

      # BLOCKER: TypeScript 7 (the native Go port) crashes Next's build worker with
      #   'The "id" argument must be of type string. Received undefined'
      #   (Pantheon build aab7f9b2). Next 16.2.x's TS integration does not support it.
      # LIFT WHEN: Next.js declares TypeScript 7 support. Retest on a PR environment.
      - dependency-name: "typescript"
        versions: ["7.x"]

      # BLOCKER: ESLint 10 breaks eslint-plugin-react — 'TypeError: Error while
      #   loading rule react/display-name: contextOrFilename.getFilename is not a
      #   function'. The plugin is a transitive dep of eslint-config-next, so this is
      #   not ours to patch.
      # LIFT WHEN: eslint-plugin-react supports ESLint 10's rule-context API, which
      #   usually arrives via an eslint-config-next release. Verify with
      #   `npm run lint` after bumping.
      - dependency-name: "eslint"
        versions: ["10.x"]

    groups:
      # Group minor/patch updates to reduce PR noise
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
