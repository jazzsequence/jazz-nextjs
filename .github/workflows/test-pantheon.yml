name: Test on Pantheon

# GitHub Pages Setup Required:
# 1. Go to repository Settings → Pages
# 2. Set Source to "Deploy from a branch"
# 3. Select branch "gh-pages" and folder "/ (root)"
# 4. Save
# 5. Playwright reports will be available at:
#    https://{username}.github.io/{repo}/reports/{run_id}
#
# Note: peaceiris/actions-gh-pages pushes to gh-pages branch
# The first deployment will create this branch automatically

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PANTHEON_SITE_NAME: jazz-nextjs15

permissions:
  contents: write  # Required for GitHub Pages deployment
  pages: write
  id-token: write

jobs:
  test:
    name: Test deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Runs before the Pantheon build wait so lint output is visible in ~1 minute
      # instead of after a ~10 minute deploy, and so it still reports when the build
      # fails. Note continue-on-error means the run only goes red at the final gate
      # step, not here. Catches dependency bumps that break the lint toolchain
      # (e.g. an ESLint major that breaks eslint-plugin-react), which the
      # deployed-site tests cannot detect.
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUM=${{ github.event.pull_request.number }}
            ENV_NAME="pr-${PR_NUM}"
            BASE_URL="https://pr-${PR_NUM}-${PANTHEON_SITE_NAME}.pantheonsite.io"
          else
            ENV_NAME="dev"
            BASE_URL="https://dev-${PANTHEON_SITE_NAME}.pantheonsite.io"
          fi
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "base_url=${BASE_URL}" >> $GITHUB_OUTPUT

      # Pantheon's Cloudflare-backed GCDN answers unverified automation (Playwright, Actions
      # runners) with a managed challenge, HTTP 403. A per-site bot-bypass token exempts it,
      # but it rotates (each one is valid for 6 months, a new one starts every 3), so it is
      # fetched fresh each run rather than stored — a stored copy would silently expire and turn
      # every E2E run red. Needs a Pantheon Personal Access Token in BOTH the Actions and the
      # Dependabot secret stores (Dependabot-triggered runs cannot read Actions secrets).
      # continue-on-error so unit tests still report; the readiness check below then fails loudly.
      # The token goes through a masked step output, not GITHUB_ENV, so third-party actions
      # later in the job (gh-pages, upload-artifact) never see it.
      - name: Fetch Pantheon bot-bypass token
        id: bypass
        continue-on-error: true
        env:
          PANTHEON_ACCESS_TOKEN: ${{ secrets.PANTHEON_ACCESS_TOKEN }}
        run: |
          if [ -z "$PANTHEON_ACCESS_TOKEN" ]; then
            echo "::error::PANTHEON_ACCESS_TOKEN is empty. Add it as an Actions secret AND a Dependabot secret."
            exit 1
          fi

          curl -fsSL "https://github.com/pantheon-systems/terminus/releases/download/4.3.3/terminus.phar" -o terminus
          chmod +x terminus
          sudo mv terminus /usr/local/bin/terminus
          # Pinned: the plugin runs in the same process as the access token.
          terminus self:plugin:install pantheon-systems/terminus-gcdn-plugin:0.4.0
          terminus auth:login --machine-token="$PANTHEON_ACCESS_TOKEN"

          # stderr is dropped: terminus prints [notice] lines there that would corrupt the JSON.
          # `|| true` so a failed lookup reaches the explicit error below instead of exiting
          # silently under `bash -e -o pipefail`.
          TOKEN=$(terminus gcdn:bot-bypass "$PANTHEON_SITE_NAME" --format=json --fields=role,token 2>/dev/null \
            | jq -r '.[] | select(.role == "current") | .token') || true

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read the current bot-bypass token for $PANTHEON_SITE_NAME."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wait for Pantheon build and deployment to complete
        id: wait
        uses: jazzsequence/pantheon-wait-for-build@v1
        with:
          pantheon-machine-token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          site-name: ${{ env.PANTHEON_SITE_NAME }}

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: npm test -- --run
        env:
          CI: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # This check sends the bypass token so it exercises the same path the browser does — a bare
      # curl is waved through and would report "ready" while every E2E test is being challenged.
      - name: Verify Pantheon site is accessible
        env:
          BOT_BYPASS_TOKEN: ${{ steps.bypass.outputs.token }}
        run: |
          if [ -z "$BOT_BYPASS_TOKEN" ]; then
            echo "::error::No bot-bypass token — the 'Fetch Pantheon bot-bypass token' step failed (see its log). Without it Cloudflare challenges every E2E request."
            exit 1
          fi

          echo "Testing connectivity to: ${{ steps.env.outputs.base_url }}"
          echo "Waiting for site to be fully ready..."

          MAX_ATTEMPTS=12
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-pantheon-bot-bypass: ${BOT_BYPASS_TOKEN}" "${{ steps.env.outputs.base_url }}" || echo "000")

            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Site is accessible (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "⏳ Site returned HTTP $HTTP_CODE, waiting..."
              sleep 5
            fi
          done

          echo "❌ Site not accessible after 60 seconds"
          exit 1

      - name: Run E2E tests against Pantheon
        id: e2e-tests
        continue-on-error: true
        run: npm run test:e2e
        env:
          # WORDPRESS_USERNAME / WORDPRESS_APP_PASSWORD are deliberately NOT set here.
          # No spec reads them, and against a deployed BASE_URL no local server starts,
          # so the Next.js runtime that does use them is on Pantheon and sources them
          # from Pantheon env vars. Do not re-add them.
          BASE_URL: ${{ steps.env.outputs.base_url }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Read by tests/e2e/fixtures.ts, which scopes it to the app origin. See there.
          BOT_BYPASS_TOKEN: ${{ steps.bypass.outputs.token }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Deploy Playwright report to GitHub Pages
        if: always()
        continue-on-error: true  # Never fail CI over report publishing
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true
          force_push: true  # Avoid non-fast-forward failures when parallel runs race

      - name: Report status
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}"

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.env.outputs.base_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** ${{ steps.wait.outputs.deployment_ready == 'true' && '✅ Ready' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint (ESLint):** ${{ steps.lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests (Vitest):** ${{ steps.unit-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests (Playwright):** ${{ steps.e2e-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Playwright Report](${REPORT_URL}) for detailed test results" >> $GITHUB_STEP_SUMMARY

      - name: Fail workflow if any checks failed
        if: steps.lint.outcome != 'success' || steps.unit-tests.outcome != 'success' || steps.e2e-tests.outcome != 'success'
        run: exit 1
